[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fairtoy"
version = "0.1.0"
description = "Focused toy traceability and supplier impact analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "SQLAlchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[project.scripts]
fairtoy = "fairtoy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fairtoy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
